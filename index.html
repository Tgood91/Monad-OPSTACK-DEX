<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monad DEX — swap</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; } h1 small { color: #8b949e; font-weight: normal; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
          padding: 1rem; margin-top: 1rem; }
  label { display: block; margin: .5rem 0; color: #8b949e; font-size: .9rem; }
  input, select { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1.1rem;
          background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; }
  select { font-size: 1rem; }
  button { width: 100%; padding: .7rem; margin-top: .6rem; font-size: 1rem; cursor: pointer;
           background: #1f6feb; color: #fff; border: none; border-radius: 8px; }
  button:disabled { background: #30363d; color: #8b949e; cursor: default; }
  button.secondary { background: transparent; border: 1px solid #30363d; }
  button.maxbtn { width: auto; padding: .15rem .6rem; margin: 0 0 0 .5rem; font-size: .8rem; }
  #wallet { font-size: .85rem; color: #8b949e; word-break: break-all; }
  #wallet a, #txLinks a { color: #58a6ff; }
  #txLinks { font-size: .85rem; margin-top: .4rem; }
  #quoteOut, #status { font-size: .9rem; margin-top: .6rem; white-space: pre-wrap; }
  #status { color: #d29922; } .ok { color: #3fb950 !important; } .err { color: #f85149 !important; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: .25rem 0; }
  .bal { font-size: .8rem; color: #8b949e; }
  #tokenSrc { font-size: .75rem; color: #8b949e; }
</style>
</head>
<body>
  <h1>Monad DEX <small>swap</small></h1>
  <button id="connectBtn" class="secondary">Connect wallet</button>
  <div id="wallet"></div>

  <div class="card">
    <div class="row"><span>From</span><span class="bal" id="fromBal"></span></div>
    <select id="fromSel"></select>
    <label>Amount
      <input id="amount" type="text" inputmode="decimal" value="0.05">
    </label>
    <div class="row"><span></span><button id="maxBtn" class="maxbtn secondary" disabled>MAX</button></div>
    <div class="row"><span>To</span><span class="bal" id="toBal"></span></div>
    <select id="toSel"></select>
    <div class="row"><span>Source</span></div>
    <select id="srcSel">
      <option value="auto">Auto (failover)</option>
      <option value="kyber">KyberSwap</option>
      <option value="oneinch">1inch</option>
      <option value="zerox">0x</option>
      <option value="lifi">LI.FI</option>
      <option value="openocean">OpenOcean</option>
    </select>
    <button id="quoteBtn">Get quote</button>
    <div id="quoteOut"></div>
    <button id="swapBtn" disabled>Swap</button>
    <div id="status"></div>
    <div id="txLinks"></div>
    <div id="tokenSrc"></div>
  </div>

<script>
// ── Config (Monad mainnet, chain 143) ──
const CHAIN_ID   = 143;
const CHAIN_HEX  = '0x8f';
const NATIVE     = '0x0000000000000000000000000000000000000000';
const EXPLORER   = 'https://monadvision.com'; // tx/address links

// ── Aggregator API keys: fill in locally for testing. Never commit real keys. ──
const API_KEYS = {
  zeroX: '',    // 0x API key
  oneInch: '',  // 1inch API key
  // Zerion key kept for reference — Zerion's swap API does not support Monad (verified 2026-10-07).
  // zerion: 'PUT_KEY_HERE', // Zerion API key
  // LI.FI and OpenOcean need no key for quotes
};
// Failover policy (mirrors routers_0_cjcg.json)
const FAILOVER = { timeoutMs: 8000, maxSlippageBps: 100 };
const NATIVE_EEE = '0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE';

// ── Uniswap on Monad (chain 143): official SDK addresses, bytecode verified on-chain ──
// NOTE (2026-10-07): direct execution is DISABLED. Monad's V3 factory deploys pools
// with a non-canonical init code hash, so SwapRouter02/UniversalRouter compute pool
// addresses with no code (verified: router derives 0x38d6…b482, factory pool is
// 0x659b…4a9da) and every V3 swap reverts. Re-enable if pools are redeployed canonical.
const UNI = {
  universalRouter: '0xa6CE4F10d83dBdDAc17E68e1837ca9cE6a1b596e', // Universal Router v2.1.2
  v3Factory:       '0x204faca1764b154221e35c0d20abb3c525710498', // V3 core factory
  swapRouter02:    '0xfe31f71c1b106eac32f1a19239c9a9a72ddfb900', // SwapRouter02
};

// ── Fallback public RPCs for Monad (chain 143), tried in order ──
const FALLBACK_RPCS = [
  'https://rpc.monad.xyz',          // official primary
  'https://rpc1.monad.xyz',         // official secondary
  'https://rpc4.monad.xyz',
  'https://rpc-mainnet.monadinfra.com',
  'https://monad-mainnet.gateway.tatum.io',
  'https://monad-mainnet.drpc.org',
];
let _rpcIdx = 0;
async function rpcRead(method, params) {
  // Read-only JSON-RPC with failover across public endpoints (no wallet needed)
  let lastErr;
  for (let i = 0; i < FALLBACK_RPCS.length; i++) {
    const url = FALLBACK_RPCS[(_rpcIdx + i) % FALLBACK_RPCS.length];
    try {
      const res = await withTimeout(fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
      }), FAILOVER.timeoutMs);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (j.error) throw new Error(j.error.message || 'RPC error');
      _rpcIdx = (_rpcIdx + i) % FALLBACK_RPCS.length; // stick with what works
      return j.result;
    } catch (e) { lastErr = e; }
  }
  throw new Error('All Monad RPCs failed: ' + (lastErr?.message || lastErr));
}

// Hardcoded token list (verified Monad mainnet addresses).
const FALLBACK_TOKENS = [
  { symbol: 'MON',   address: NATIVE,                                            decimals: 18 },
  { symbol: 'USDC',  address: '0x754704Bc059F8C67012fEd69BC8A327a5aafb603',       decimals: 6  },
  { symbol: 'WMON',  address: '0x3bd359C1119dA7Da1D913D1C4D2B7c461115433A',       decimals: 18 },
  { symbol: 'USDT0', address: '0xe7cd86e13AC4309349F30B3435a9d337750fC82D',       decimals: 6  },
];

let account = null;
let lastQuote = null;
let tokens = [];

const $ = id => document.getElementById(id);
const status = (msg, cls='') => { const el=$('status'); el.textContent=msg; el.className=cls; };

function toUnits(str, decimals) {
  const [w = '0', f = ''] = String(str).trim().split('.');
  if (!/^\d+$/.test(w) || !/^\d*$/.test(f)) throw new Error('Bad amount');
  const frac = (f + '0'.repeat(decimals)).slice(0, decimals);
  return (BigInt(w) * 10n**BigInt(decimals) + BigInt(frac || '0')).toString();
}
function fmtUnits(v, d, trim=true) {
  const s = v.toString().padStart(d + 1, '0');
  const w = s.slice(0, -d) || '0';
  let f = s.slice(-d).replace(/0+$/, '');
  if (trim) f = f.slice(0, 6);
  return f ? w + '.' + f : w;
}
const toHex = v => '0x' + BigInt(v).toString(16);
const tok = addr => tokens.find(t => t.address.toLowerCase() === addr.toLowerCase());

function pinOrder(a, b) {
  const pin = ['MON', 'USDC', 'WMON', 'USDT0'];
  const ia = pin.indexOf(a.symbol), ib = pin.indexOf(b.symbol);
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return a.symbol.localeCompare(b.symbol);
}

async function loadTokens() {
  tokens = FALLBACK_TOKENS.slice().sort(pinOrder);
  fillSelects();
}

function fillSelects() {
  for (const sel of [$('fromSel'), $('toSel')]) {
    sel.innerHTML = '';
    for (const t of tokens) {
      const o = document.createElement('option');
      o.value = t.address;
      o.textContent = t.symbol + (t.address === NATIVE ? ' (native)' : '');
      sel.appendChild(o);
    }
  }
  $('fromSel').value = tok('0x754704Bc059F8C67012fEd69BC8A327a5aafb603')?.address || tokens[0].address; // USDC
  $('toSel').value = NATIVE; // MON
  $('tokenSrc').textContent = 'Token list: local (' + tokens.length + ' tokens)';
  refreshBalances();
}

async function tokenDecimals(t) {
  if (t.decimals != null) return t.decimals;
  // fetch decimals() on-chain: 0x313ce567
  const r = await window.ethereum.request({
    method: 'eth_call',
    params: [{ to: t.address, data: '0x313ce567' }, 'latest'],
  });
  const d = parseInt(r.slice(-2), 16);
  t.decimals = d;
  return d;
}

async function getBalance(t) {
  if (t.address === NATIVE) {
    const hex = await window.ethereum.request({ method: 'eth_getBalance', params: [account, 'latest'] });
    return { raw: BigInt(hex), decimals: 18 };
  }
  const decimals = await tokenDecimals(t);
  const data = '0x70a08231' + account.slice(2).padStart(64, '0');
  const hex = await window.ethereum.request({ method: 'eth_call', params: [{ to: t.address, data }, 'latest'] });
  return { raw: BigInt(hex), decimals };
}

async function refreshBalances() {
  if (!account) { $('fromBal').textContent = ''; $('toBal').textContent = ''; $('maxBtn').disabled = true; return; }
  try {
    const from = tok($('fromSel').value), to = tok($('toSel').value);
    const [fb, tb] = await Promise.all([getBalance(from), getBalance(to)]);
    $('fromBal').innerHTML = 'Balance: ' + fmtUnits(fb.raw, fb.decimals);
    $('toBal').innerHTML = 'Balance: ' + fmtUnits(tb.raw, tb.decimals);
    $('fromBal').dataset.raw = fb.raw.toString();
    $('fromBal').dataset.decimals = fb.decimals;
    $('maxBtn').disabled = false;
  } catch (e) { status('Balance check failed: ' + (e.message || e), 'err'); }
}

$('maxBtn').onclick = () => {
  const raw = BigInt($('fromBal').dataset.raw || '0');
  const d = parseInt($('fromBal').dataset.decimals || '18', 10);
  $('amount').value = fmtUnits(raw, d, false);
};

$('connectBtn').onclick = async () => {
  try {
    if (!window.ethereum) return status('No wallet found. Install MetaMask/Rabbit first.', 'err');
    [account] = await window.ethereum.request({ method: 'eth_requestAccounts' });
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_HEX }] });
    } catch (e) {
      if (e.code === 4902) return status('Add Monad (chain ID 143) to your wallet, then reconnect.', 'err');
      throw e;
    }
    $('wallet').innerHTML = 'Connected: <a href="' + EXPLORER + '/address/' + account +
      '" target="_blank" rel="noopener">' + account + '</a>';
    status('');
    refreshBalances();
  } catch (e) { status('Connect failed: ' + (e.message || e), 'err'); }
};

$('fromSel').onchange = refreshBalances;
$('toSel').onchange = () => { lastQuote = null; $('swapBtn').disabled = true; $('quoteOut').innerHTML=''; refreshBalances(); };

// ── Quote sources ──────────────────────────────────────────────
// Each returns { outFormatted, outSymbol, rate, impactUsd, impactPct, steps }
// where steps = [{ id, to, data, value }] executed in order.
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
async function ethCall(to, data) {
  return window.ethereum.request({ method: 'eth_call', params: [{ to, data, from: account }, 'latest'] });
}
async function allowanceOf(token, owner, spender) {
  const data = '0xdd62ed3e' + owner.slice(2).padStart(64, '0') + spender.slice(2).padStart(64, '0');
  return BigInt(await ethCall(token, data));
}
function approveCalldata(spender) {
  return '0x095ea7b3' + spender.slice(2).padStart(64, '0') + 'f'.repeat(64);
}
async function maybeApprove(token, owner, spender, amount) {
  const allow = await allowanceOf(token, owner, spender);
  if (allow < BigInt(amount))
    return [{ id: 'approve', to: token, data: approveCalldata(spender), value: '0x0' }];
  return [];
}

async function quoteZerion(from, to, amount) {
  // Zerion swap quotes: single call returns best-first quotes with
  // ready-to-sign approve + swap transactions. Basic auth, key as username.
  if (!API_KEYS.zerion) throw new Error('Zerion API key not set');
  const H = { 'Authorization': 'Basic ' + btoa(API_KEYS.zerion + ':') };
  const fin  = from.address === NATIVE ? '0x0000000000000000000000000000000000000000' : from.address;
  const fout = to.address === NATIVE ? '0x0000000000000000000000000000000000000000' : to.address;
  const p = new URLSearchParams({
    from: account, to: account,
    'input[chain_id]': 'monad',
    'input[fungible_id]': fin,
    'input[amount]': fmtUnits(BigInt(amount), from.decimals ?? 18, false),
    'output[fungible_id]': fout,
    'slippage_percent': String(FAILOVER.maxSlippageBps / 100),
    currency: 'usd',
  });
  const res = await fetch('https://api.zerion.io/v1/swap/quotes/?' + p.toString(), { headers: H });
  if (!res.ok) throw new Error('Zerion HTTP ' + res.status);
  const j = await res.json();
  const quotes = (j.data || []).map(x => x.attributes || x);
  const q = quotes.find(a => {
    const s = a.transaction_swap?.evm || a.transaction_swap;
    return s && s.to && s.data;
  });
  if (!q) throw new Error('Zerion returned no executable quote');
  const swapTx = q.transaction_swap.evm || q.transaction_swap;
  const steps = [];
  const ap = q.transaction_approve?.evm || q.transaction_approve;
  if (ap && ap.to && ap.data && from.address !== NATIVE) {
    const spender = '0x' + ap.data.slice(34, 74); // approve(address,uint256) first arg
    if ((await maybeApprove(from.address, account, spender, amount)).length)
      steps.push({ id: 'approve', to: ap.to, data: ap.data, value: '0x0' });
  }
  steps.push({ id: 'swap', to: swapTx.to, data: swapTx.data, value: toHex(swapTx.value || '0') });
  const dec = to.decimals ?? 18;
  const outRaw = String(q.output_amount_after_fees ?? q.output_amount ?? '0');
  const outFormatted = outRaw.includes('.') ? outRaw : fmtUnits(BigInt(outRaw), dec);
  return { outFormatted, outSymbol: to.symbol, rate: null, impactUsd: null, impactPct: null, steps };
}

async function quote1inch(from, to, amount) {
  if (!API_KEYS.oneInch) throw new Error('1inch API key not set');
  const H = { 'Authorization': 'Bearer ' + API_KEYS.oneInch };
  const src = from.address === NATIVE ? NATIVE_EEE : from.address;
  const dst = to.address === NATIVE ? NATIVE_EEE : to.address;
  const base = 'https://api.1inch.dev/swap/v6.0/143';
  const qr = await fetch(`${base}/quote?src=${src}&dst=${dst}&amount=${amount}`, { headers: H });
  if (!qr.ok) throw new Error('1inch quote HTTP ' + qr.status);
  const qq = await qr.json();
  const sr = await fetch(`${base}/swap?src=${src}&dst=${dst}&amount=${amount}&from=${account}&slippage=${FAILOVER.maxSlippageBps / 100}&disableEstimate=true`, { headers: H });
  if (!sr.ok) throw new Error('1inch swap HTTP ' + sr.status);
  const sq = await sr.json();
  const steps = from.address === NATIVE ? [] : await maybeApprove(from.address, account, sq.tx.to, amount);
  steps.push({ id: 'swap', to: sq.tx.to, data: sq.tx.data, value: toHex(sq.tx.value || '0') });
  return { outFormatted: fmtUnits(BigInt(qq.dstAmount), to.decimals ?? 18), outSymbol: to.symbol,
           rate: null, impactUsd: null, impactPct: null, steps };
}

async function quote0x(from, to, amount) {
  if (!API_KEYS.zeroX) throw new Error('0x API key not set');
  const sellToken = from.address === NATIVE ? NATIVE_EEE : from.address;
  const buyToken = to.address === NATIVE ? NATIVE_EEE : to.address;
  const url = `https://api.0x.org/swap/allowance-holder/quote?chainId=143` +
    `&sellToken=${sellToken}&buyToken=${buyToken}&sellAmount=${amount}` +
    `&taker=${account}&slippageBps=${FAILOVER.maxSlippageBps}`;
  const res = await fetch(url, { headers: { '0x-api-key': API_KEYS.zeroX, '0x-version': 'v2' } });
  if (!res.ok) throw new Error('0x HTTP ' + res.status);
  const q = await res.json();
  const tx = q.transaction || q;
  if (!tx.to || !tx.data) throw new Error('0x returned no transaction');
  const spender = q.issues?.allowance?.spender || q.allowanceTarget;
  const steps = (from.address !== NATIVE && spender)
    ? await maybeApprove(from.address, account, spender, amount) : [];
  steps.push({ id: 'swap', to: tx.to, data: tx.data, value: toHex(tx.value || '0') });
  return { outFormatted: fmtUnits(BigInt(q.buyAmount), to.decimals ?? 18), outSymbol: to.symbol,
           rate: null, impactUsd: null, impactPct: null, steps };
}

async function quoteLifi(from, to, amount) {
  const url = `https://li.quest/v1/quote?fromChain=143&toChain=143&fromToken=${from.address}&toToken=${to.address}` +
    `&fromAmount=${amount}&fromAddress=${account}&slippage=${(FAILOVER.maxSlippageBps / 10000).toFixed(4)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('LI.FI HTTP ' + res.status);
  const q = await res.json();
  const t = q.transactionRequest;
  if (!t || !t.data) throw new Error('LI.FI returned no transaction');
  const steps = (q.estimate?.approvalAddress && from.address !== NATIVE)
    ? await maybeApprove(from.address, account, q.estimate.approvalAddress, amount) : [];
  steps.push({ id: 'swap', to: t.to, data: t.data, value: toHex(t.value || '0') });
  return { outFormatted: fmtUnits(BigInt(q.estimate.toAmount), to.decimals ?? 18), outSymbol: to.symbol,
           rate: null, impactUsd: null, impactPct: null, steps };
}

async function quoteOpenOcean(from, to, amount) {
  const inA = from.address === NATIVE ? NATIVE_EEE : from.address;
  const outA = to.address === NATIVE ? NATIVE_EEE : to.address;
  const gasPrice = parseInt(await window.ethereum.request({ method: 'eth_gasPrice', params: [] }), 16);
  const qurl = `https://open-api.openocean.finance/v4/143/quote?inTokenAddress=${inA}&outTokenAddress=${outA}&amount=${amount}&gasPrice=${gasPrice}`;
  const qr = await fetch(qurl);
  if (!qr.ok) throw new Error('OpenOcean quote HTTP ' + qr.status);
  const qq = await qr.json();
  const surl = `https://open-api.openocean.finance/v4/143/swap?inTokenAddress=${inA}&outTokenAddress=${outA}` +
    `&amount=${amount}&account=${account}&slippage=${FAILOVER.maxSlippageBps / 100}&gasPrice=${gasPrice}`;
  const sr = await fetch(surl);
  if (!sr.ok) throw new Error('OpenOcean swap HTTP ' + sr.status);
  const sq = await sr.json();
  const d = sq.data || {};
  if (!d.data || !d.to) throw new Error('OpenOcean returned no transaction');
  const steps = (from.address !== NATIVE && d.approveTo)
    ? await maybeApprove(from.address, account, d.approveTo, amount) : [];
  steps.push({ id: 'swap', to: d.to, data: d.data, value: toHex(d.value || '0') });
  const outAmt = d.outAmount || qq.data?.outAmount || '0';
  return { outFormatted: fmtUnits(BigInt(outAmt), to.decimals ?? 18), outSymbol: to.symbol,
           rate: null, impactUsd: null, impactPct: null, steps };
}

async function quoteKyber(from, to, amount) {
  // Keyless: routes + build, no API key. routerAddress comes from the API per chain.
  const inA = from.address === NATIVE ? NATIVE_EEE : from.address;
  const outA = to.address === NATIVE ? NATIVE_EEE : to.address;
  const base = 'https://aggregator-api.kyberswap.com/monad/api/v1';
  const qr = await fetch(`${base}/routes?tokenIn=${inA}&tokenOut=${outA}&amountIn=${amount}&source=tanner-dex`);
  if (!qr.ok) throw new Error('KyberSwap routes HTTP ' + qr.status);
  const qd = await qr.json();
  const rs = qd.data && qd.data.routeSummary;
  if (qd.code !== 0 || !rs) throw new Error('KyberSwap returned no route');
  const br = await fetch(`${base}/route/build`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ routeSummary: rs, sender: account, recipient: account,
      slippageTolerance: FAILOVER.maxSlippageBps,
      deadline: Math.floor(Date.now() / 1000) + 1200, source: 'tanner-dex' }),
  });
  if (!br.ok) throw new Error('KyberSwap build HTTP ' + br.status);
  const bd = await br.json();
  const b = bd.data;
  if (bd.code !== 0 || !b || !b.data || !b.routerAddress) throw new Error('KyberSwap build failed');
  const steps = (from.address !== NATIVE)
    ? await maybeApprove(from.address, account, b.routerAddress, amount) : [];
  steps.push({ id: 'swap', to: b.routerAddress, data: b.data, value: toHex(b.transactionValue || '0') });
  return { outFormatted: fmtUnits(BigInt(b.amountOut), to.decimals ?? 18), outSymbol: to.symbol,
           rate: null, impactUsd: null, impactPct: null, steps };
}

// Failover order: KyberSwap (keyless) → 1inch → 0x → LI.FI → OpenOcean
// (Uniswap direct disabled: non-canonical V3 pool init code hash on Monad)
const SOURCES = [
  { id: 'kyber',     label: 'KyberSwap',          fn: quoteKyber },
  { id: 'oneinch',   label: '1inch',             fn: quote1inch },
  { id: 'zerox',     label: '0x',                fn: quote0x },
  { id: 'lifi',      label: 'LI.FI',             fn: quoteLifi },
  { id: 'openocean', label: 'OpenOcean',         fn: quoteOpenOcean },
];

async function getQuoteAuto(from, to, amount) {
  const errors = [];
  for (const s of SOURCES) {
    try {
      const q = await withTimeout(s.fn(from, to, amount), FAILOVER.timeoutMs);
      return { ...q, source: s.label };
    } catch (e) { errors.push(s.label + ': ' + (e.message || e)); }
  }
  throw new Error('All sources failed — ' + errors.join(' | '));
}

$('quoteBtn').onclick = async () => {
  try {
    if (!account) return status('Connect your wallet first.', 'err');
    const from = tok($('fromSel').value), to = tok($('toSel').value);
    if (from.address.toLowerCase() === to.address.toLowerCase())
      return status('Pick two different tokens.', 'err');
    status('Fetching quote…');
    $('swapBtn').disabled = true;
    const fromBal = BigInt($('fromBal').dataset.raw || '0');
    const fromDec = await tokenDecimals(from);
    const amount = toUnits($('amount').value, fromDec);
    if (BigInt(amount) <= 0n) return status('Enter an amount above zero.', 'err');
    if (BigInt(amount) > fromBal) return status('Amount exceeds your ' + from.symbol + ' balance.', 'err');
    const pick = $('srcSel').value;
    let q;
    if (pick === 'auto') {
      q = await getQuoteAuto(from, to, amount);
    } else {
      const s = SOURCES.find(x => x.id === pick);
      q = { ...(await withTimeout(s.fn(from, to, amount), FAILOVER.timeoutMs)), source: s.label };
    }
    lastQuote = q;
    $('quoteOut').innerHTML =
      `<div class="row"><span>Source</span><strong>${q.source}</strong></div>` +
      `<div class="row"><span>You get</span><strong>${q.outFormatted || '?'} ${q.outSymbol}</strong></div>` +
      (q.rate ? `<div class="row"><span>Rate</span><span>${Number(q.rate).toFixed(6)} ${q.outSymbol}/${from.symbol}</span></div>` : '') +
      (q.impactUsd ? `<div class="row"><span>Price impact</span><span>$${q.impactUsd} (${q.impactPct}%)</span></div>` : '');
    status('');
    $('swapBtn').disabled = false;
  } catch (e) { status('Quote failed: ' + (e.message || e), 'err'); }
};

async function waitForReceipt(hash) {
  for (let i = 0; i < 60; i++) {
    const r = await window.ethereum.request({ method: 'eth_getTransactionReceipt', params: [hash] });
    if (r && r.blockNumber) return r;
    await new Promise(r2 => setTimeout(r2, 2000));
  }
  throw new Error('Receipt timeout for ' + hash);
}

$('swapBtn').onclick = async () => {
  try {
    if (!lastQuote?.steps) return status('Get a quote first.', 'err');
    $('swapBtn').disabled = true;
    $('txLinks').innerHTML = '';
    for (const step of lastQuote.steps) {
      if (!step.data || !step.to) continue;
      status(`Sending: ${step.id || 'tx'}…`);
      const hash = await window.ethereum.request({ method: 'eth_sendTransaction', params: [{
        from: account, to: step.to, data: step.data,
        value: step.value || '0x0',
      }]});
      status('Confirming ' + hash + '…');
      await waitForReceipt(hash);
      const a = document.createElement('a');
      a.href = EXPLORER + '/tx/' + hash;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'View on MonadVision: ' + hash.slice(0, 12) + '…';
      $('txLinks').appendChild(a);
      $('txLinks').appendChild(document.createElement('br'));
    }
    status('Done.', 'ok');
    lastQuote = null;
    refreshBalances();
  } catch (e) { status('Swap failed: ' + (e.message || e), 'err'); }
  finally { $('swapBtn').disabled = !lastQuote; }
};

loadTokens();
</script>
</body>
</html>
