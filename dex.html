const QUOTE_TIMEOUT_MS = 8000;

/* =====================================================================
   SMALL UTILS
   ===================================================================== */
const $ = id => document.getElementById(id);
function fmtUnits(wei, dec) {
  const n = parseFloat(ethers.formatUnits(wei, dec));
  return n < 0.0001 && n > 0 ? n.toExponential(2) : n.toLocaleString(undefined, { maximumFractionDigits: 6 });
}
async function withTimeout(promise, ms) {
  const t = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
  return Promise.race([promise, t]);
}
async function readProvider(chainKey) {
  const cfg = CHAINS[chainKey];
  for (const rpc of cfg.rpcs) {
    try { const p = new ethers.JsonRpcProvider(rpc); await withTimeout(p.getBlockNumber(), 6000); return p; }
    catch (e) { /* next */ }
  }
  throw new Error('No RPC reachable for ' + cfg.label);
}

/* =====================================================================
   ADAPTERS — each implements:
     quote(chainKey, tokenIn, tokenOut, amountInWei, wallet) -> Quote|null
     buildTx(quote, wallet, slippageBps) -> { to, data, value }
   Quote = { source, amountOut (bigint), amountOutUsd?, gasUsd?, raw }
   ===================================================================== */

// ---- Velodrome: on-chain via factory + quoter ----
const Velodrome = {
  TICK_SPACINGS: [1, 10, 50, 200],
  ABI_CL_FACTORY: ['function getPool(address,address,uint24) view returns (address)'],
  ABI_CL_QUOTER: ['function quoteExactInputSingle(address,address,int24,uint256,uint160) returns (uint256)'],
  ABI_V2_FACTORY: ['function getPool(address,address,bool) view returns (address)'],
  ABI_V2_ROUTER_QUOTE: ['function getAmountsOut(uint256,tuple(address from,address to,bool stable)[]) view returns (uint256[])'],
  ABI_V2_ROUTER_SWAP: ['function swapExactTokensForTokens(uint256,uint256,tuple(address from,address to,bool stable)[],address,uint256) returns (uint256[])'],
  ABI_V2_ROUTER_SWAP_ETH: ['function swapExactETHForTokens(uint256,tuple(address from,address to,bool stable)[],address,uint256) payable returns (uint256[])'],
  ABI_CL_ROUTER: ['function exactInputSingle(tuple(address tokenIn,address tokenOut,int24 tickSpacing,address recipient,uint256 deadline,uint256 amountIn,uint256 amountOutMinimum,uint160 sqrtPriceLimitX96)) payable returns (uint256)'],

  async quote(chainKey, tokenIn, tokenOut, amountInWei) {
    const velo = CHAINS[chainKey].velo;
    if (!velo) return null;
    const rp = await readProvider(chainKey);
    const cands = [];
    // CL pools
    if (velo.clFactory && velo.clQuoter) {
      const fac = new ethers.Contract(velo.clFactory, this.ABI_CL_FACTORY, rp);
      const quo = new ethers.Contract(velo.clQuoter, this.ABI_CL_QUOTER, rp);
      for (const ts of this.TICK_SPACINGS) {
        try {
          const pool = await fac.getPool(tokenIn.address, tokenOut.address, ts);
          if (pool === ethers.ZeroAddress) continue;
          const out = await quo.quoteExactInputSingle.staticCall(tokenIn.address, tokenOut.address, ts, amountInWei, 0);
          if (out > 0n) cands.push({ kind: 'CL', tickSpacing: ts, pool, amountOut: out, router: velo.clRouter });
        } catch (e) { /* no pool or quote reverted */ }
      }
    }
    // v2 pools
    if (velo.v2Factory && velo.v2Router) {
      const fac = new ethers.Contract(velo.v2Factory, this.ABI_V2_FACTORY, rp);
      const rou = new ethers.Contract(velo.v2Router, this.ABI_V2_ROUTER_QUOTE, rp);
      for (const stable of [true, false]) {
        try {
          const pool = await fac.getPool(tokenIn.address, tokenOut.address, stable);
          if (pool === ethers.ZeroAddress) continue;
          const routes = [{ from: tokenIn.address, to: tokenOut.address, stable }];
          const amts = await rou.getAmountsOut.staticCall(amountInWei, routes);
          const out = amts[amts.length - 1];
          if (out > 0n) cands.push({ kind: stable ? 'v2-stable' : 'v2-volatile', pool, amountOut: out, routes, router: velo.v2Router });
        } catch (e) { /* no pool or quote reverted */ }
      }
    }
    if (!cands.length) return null;
    cands.sort((a, b) => (a.amountOut < b.amountOut ? 1 : -1));
    const best = cands[0];
    return { source: 'velodrome', amountOut: best.amountOut, raw: best };
  },

  async buildTx(q, wallet, slippageBps) {
    const b = q.raw, deadline = Math.floor(Date.now() / 1000) + 900;
    const minOut = b.amountOut * BigInt(10000 - slippageBps) / 10000n;
    if (b.kind === 'CL') {
      const router = new ethers.Contract(b.router, this.ABI_CL_ROUTER, signer);
      const params = { tokenIn: q.tokenIn.address, tokenOut: q.tokenOut.address, tickSpacing: b.tickSpacing, recipient: wallet, deadline, amountIn: q.amountInWei, amountOutMinimum: minOut, sqrtPriceLimitX96: 0 };
      const pop = await router.exactInputSingle.populateTransaction(params, { value: q.tokenIn.isNative ? q.amountInWei : 0 });
      return { to: b.router, data: pop.data, value: q.tokenIn.isNative ? q.amountInWei : 0n, spender: b.router };
    }
    const router = new ethers.Contract(b.router, q.tokenIn.isNative ? this.ABI_V2_ROUTER_SWAP_ETH : this.ABI_V2_ROUTER_SWAP, signer);
    let pop;
    if (q.tokenIn.isNative) pop = await router.swapExactETHForTokens.populateTransaction(minOut, b.routes, wallet, deadline, { value: q.amountInWei });
    else pop = await router.swapExactTokensForTokens.populateTransaction(q.amountInWei, minOut, b.routes, wallet, deadline);
    return { to: b.router, data: pop.data, value: q.tokenIn.isNative ? q.amountInWei : 0n, spender: b.router };
  },
};

// ---- KyberSwap: REST aggregator ----
const KyberSwap = {
  async quote(chainKey, tokenIn, tokenOut, amountInWei) {
    const name = CHAINS[chainKey].kyberName;
    if (!name) return null;
    const inAddr = tokenIn.isNative ? NATIVE : tokenIn.address;
    const url = `https://aggregator-api.kyberswap.com/${name}/api/v1/routes?tokenIn=${inAddr}&tokenOut=${tokenOut.address}&amountIn=${amountInWei.toString()}&gasInclude=true`;
    const r = await (await fetch(url)).json();
    const rs = r?.data?.routeSummary;
    if (!rs || !rs.amountOut) return null;
    return { source: 'kyberswap', amountOut: BigInt(rs.amountOut), amountOutUsd: parseFloat(rs.amountOutUsd || 0), gasUsd: parseFloat(rs.gasUsd || 0), raw: rs };
  },
  async buildTx(q, wallet, slippageBps) {
    const name = CHAINS[q.chainKey].kyberName;
    const r = await (await fetch(`https://aggregator-api.kyberswap.com/${name}/api/v1/route/build`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ routeSummary: q.raw, sender: wallet, recipient: wallet, slippageTolerance: slippageBps, deadline: Math.floor(Date.now() / 1000) + 1200 }),
    })).json();
    const tx = r?.data;
    if (!tx?.data) throw new Error('KyberSwap build failed');
    return { to: tx.to, data: tx.data, value: BigInt(tx.value || 0), spender: tx.to };
  },
};

// ---- LI.FI: REST aggregator + bridge ----
const Lifi = {
  async quote(chainKey, tokenIn, tokenOut, amountInWei, wallet, slippageBps) {
    const id = CHAINS[chainKey].chainId;
    const fromToken = tokenIn.isNative ? '0x0000000000000000000000000000000000000000' : tokenIn.address;
    const slip = (slippageBps / 10000).toFixed(4);
    const url = `https://li.quest/v1/quote?fromChain=${id}&toChain=${id}&fromToken=${fromToken}&toToken=${tokenOut.address}&fromAmount=${amountInWei.toString()}&fromAddress=${wallet || '0x0000000000000000000000000000000000000001'}&slippage=${slip}`;
    const r = await (await fetch(url)).json();
    if (!r?.estimate?.toAmount || !r?.transactionRequest) return null;
    return { source: 'lifi', amountOut: BigInt(r.estimate.toAmount), amountOutUsd: parseFloat(r.estimate.toAmountUSD || 0), gasUsd: parseFloat(r.estimate.gasCosts?.[0]?.amountUSD || 0), raw: r };
  },
  async buildTx(q) {
    const t = q.raw.transactionRequest;
    if (!t?.data) throw new Error('LI.FI build failed');
    return { to: t.to, data: t.data, value: BigInt(t.value || 0), spender: t.to };
  },
};

// ---- Velora (ParaSwap): REST aggregator ----
const Velora = {
  async quote(chainKey, tokenIn, tokenOut, amountInWei) {
    const id = CHAINS[chainKey].chainId;
    const src = tokenIn.isNative ? NATIVE : tokenIn.address;
    let url = `https://api.paraswap.io/prices?network=${id}&srcToken=${src}&destToken=${tokenOut.address}&amount=${amountInWei.toString()}&side=SELL&version=6.2`;
    if (chainKey === 'unichain') url += `&srcDecimals=${tokenIn.decimals}&destDecimals=${tokenOut.decimals}`;
    const r = await (await fetch(url)).json();
    const pr = r?.priceRoute;
    if (!pr?.destAmount) return null;
    return { source: 'velora', amountOut: BigInt(pr.destAmount), amountOutUsd: parseFloat(pr.destUSD || 0), gasUsd: parseFloat(pr.gasCostUSD || 0), raw: pr };
  },
  async buildTx(q, wallet, slippageBps) {
    const id = CHAINS[q.chainKey].chainId;
    const r = await (await fetch(`https://api.paraswap.io/transactions/${id}?ignoreChecks=true`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        srcToken: q.tokenIn.isNative ? NATIVE : q.tokenIn.address,
        destToken: q.tokenOut.address, srcDecimals: q.tokenIn.decimals, destDecimals: q.tokenOut.decimals,
        priceRoute: q.raw, userAddress: wallet, receiver: wallet,
        slippage: slippageBps, // Velora takes basis points (50 = 0.5%)
      }),
    })).json();
    // Velora slippage param is in basis points of a percent... use slippageBps*100 safely
    if (!r?.data) throw new Error('Velora build failed: ' + JSON.stringify(r).slice(0, 120));
    return { to: r.to, data: r.data, value: BigInt(r.value || 0), spender: r.to };
  },
};

const ADAPTERS = { velodrome: Velodrome, kyberswap: KyberSwap, lifi: Lifi, velora: Velora };

/* =====================================================================
   QUOTE ENGINE — parallel, timed, normalized, best-wins
   ===================================================================== */
async function quoteAll(chainKey, tokenIn, tokenOut, amountInWei, wallet, enabledSources, slippageBps) {
  const jobs = enabledSources.map(src => (async () => {
    try {
      const q = await withTimeout(ADAPTERS[src].quote(chainKey, tokenIn, tokenOut, amountInWei, wallet, slippageBps), QUOTE_TIMEOUT_MS);
      if (!q || q.amountOut <= 0n) return { source: src, ok: false, reason: 'no liquidity' };
      return { source: src, ok: true, quote: { ...q, chainKey, tokenIn, tokenOut, amountInWei } };
    } catch (e) {
      return { source: src, ok: false, reason: (e.message || 'error').slice(0, 60) };
    }
  })());
  const results = await Promise.all(jobs);
  const good = results.filter(r => r.ok).sort((a, b) => (a.quote.amountOut < b.quote.amountOut ? 1 : -1));
  return { all: results, best: good[0] || null };
}

/* =====================================================================
   APP STATE + UI
   ===================================================================== */
let provider = null, signer = null, wallet = null;
let chainKey = 'celo';
let enabledSources = new Set(['velodrome', 'kyberswap', 'lifi', 'velora']);
let quotes = null, selectedQuote = null, quoteTimer = null;
let slippageBps = 50;

function chainTokens() { return CHAINS[chainKey].tokens; }

function renderChains() {
  const g = $('chainGrid'); g.innerHTML = '';
  for (const [key, c] of Object.entries(CHAINS)) {
    const b = document.createElement('button');
    b.className = 'chain-btn' + (key === chainKey ? ' active' : '');
    b.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    b.onclick = () => switchChainUI(key);
    g.appendChild(b);
  }
}
function renderSources() {
  const row = $('srcRow'); row.innerHTML = '';
  for (const src of CHAINS[chainKey].sources) {
    const m = SOURCE_META[src];
    const chip = document.createElement('button');
    chip.className = 'src-chip' + (enabledSources.has(src) ? ' active' : ' off');
    chip.textContent = m.label;
    chip.title = m.tag;
    chip.onclick = () => {
      enabledSources.has(src) ? enabledSources.delete(src) : enabledSources.add(src);
      renderSources(); scheduleQuote();
    };
    row.appendChild(chip);
  }
}
function renderTokens() {
  const toks = chainTokens();
  for (const id of ['fromToken', 'toToken']) { $(id).innerHTML = ''; toks.forEach((t, i) => $(id).add(new Option(t.symbol, i))); }
  $('fromToken').selectedIndex = 0;
  $('toToken').selectedIndex = Math.min(1, toks.length - 1);
}
function selTokens() {
  const toks = chainTokens();
  return { in: toks[$('fromToken').value], out: toks[$('toToken').value] };
}

async function switchChainUI(key) {
  chainKey = key;
  renderChains(); renderSources(); renderTokens();
  $('fromAmount').value = ''; $('toAmount').value = '';
  quotes = null; selectedQuote = null;
  $('quoteBox').innerHTML = '<div class="status">Enter an amount to compare quotes</div>';
  $('quoteDetail').innerHTML = '';
  $('swapBtn').disabled = true; $('swapBtn').textContent = 'Enter an amount';
  if (wallet) { await ensureNetwork(); }
  updateBalances(); scheduleQuote();
}

async function ensureNetwork() {
  const cfg = CHAINS[chainKey];
  const net = await signer.provider.getNetwork();
  if (Number(net.chainId) !== cfg.chainId) {
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + cfg.chainId.toString(16) }] });
    } catch (e) {
      if (e.code === 4902) await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x' + cfg.chainId.toString(16), chainName: cfg.label, nativeCurrency: { name: cfg.native, symbol: cfg.native, decimals: 18 }, rpcUrls: cfg.rpcs, blockExplorerUrls: [cfg.explorer] }] });
      else throw e;
    }
    signer = await new ethers.BrowserProvider(window.ethereum).getSigner();
  }
  $('networkStatus').textContent = cfg.label + ' ✓';
}

async function updateBalances() {
  if (!wallet) return;
  const { in: tIn, out: tOut } = selTokens();
  let rp;
  try { rp = signer.provider; } catch (e) { rp = await readProvider(chainKey); }
  const erc20 = new ethers.Interface(['function balanceOf(address) view returns (uint256)']);
  for (const [tok, el] of [[tIn, 'fromBalance'], [tOut, 'toBalance']]) {
    try {
      const c = new ethers.Contract(tok.address, erc20, rp);
      const wrapped = await c.balanceOf(wallet);
      let label = `${fmtUnits(wrapped, tok.decimals)} ${tok.symbol}`;
      if (tok.isNative) {
        const native = await rp.getBalance(wallet);
        label = `${fmtUnits(native, 18)} ${CHAINS[chainKey].native} (+${fmtUnits(wrapped, tok.decimals)} wrapped)`;
      }
      $(el).textContent = 'Balance: ' + label;
    } catch (e) { $(el).textContent = 'Balance: —'; }
  }
}

function scheduleQuote() { clearTimeout(quoteTimer); quoteTimer = setTimeout(refreshQuotes, 700); }

async function refreshQuotes() {
  const box = $('quoteBox'), detail = $('quoteDetail'), swapBtn = $('swapBtn'), approveBtn = $('approveBtn');
  approveBtn.style.display = 'none';
  selectedQuote = null;
  const amtStr = $('fromAmount').value;
  const { in: tIn, out: tOut } = selTokens();
  const activeSources = CHAINS[chainKey].sources.filter(s => enabledSources.has(s));

  if (!amtStr || parseFloat(amtStr) <= 0) {
    box.innerHTML = '<div class="status">Enter an amount to compare quotes</div>'; detail.innerHTML = '';
    swapBtn.disabled = true; swapBtn.textContent = 'Enter an amount'; $('toAmount').value = ''; return;
  }
  if (tIn.address.toLowerCase() === tOut.address.toLowerCase()) {
    box.innerHTML = '<div class="status error">Pick two different tokens</div>';
    swapBtn.disabled = true; swapBtn.textContent = 'Select tokens'; return;
  }
  if (!activeSources.length) {
    box.innerHTML = '<div class="status error">Enable at least one quote source</div>';
    swapBtn.disabled = true; return;
  }

  box.innerHTML = `<div class="status"><span class="spinner"></span>Quoting via ${activeSources.map(s => SOURCE_META[s].label).join(', ')}…</div>`;
  detail.innerHTML = ''; swapBtn.disabled = true;

  try {
    const amountInWei = ethers.parseUnits(amtStr, tIn.decimals);
    quotes = await quoteAll(chainKey, tIn, tOut, amountInWei, wallet, activeSources, slippageBps);
    renderQuotes(tIn, tOut, amtStr);
  } catch (e) {
    box.innerHTML = '<div class="status error">Quote failed: ' + e.message.slice(0, 100) + '</div>';
  }
}

function renderQuotes(tIn, tOut, amtStr) {
  const box = $('quoteBox'), detail = $('quoteDetail'), swapBtn = $('swapBtn');
  const good = quotes.all.filter(r => r.ok);
  if (!good.length) {
    const reasons = quotes.all.map(r => `${SOURCE_META[r.source].label}: ${r.reason}`).join(' · ');
    box.innerHTML = `<div class="status warn">No liquidity from any enabled source.</div><div class="status" style="font-size:11px">${reasons}</div>`;
    swapBtn.disabled = true; swapBtn.textContent = 'No liquidity'; $('toAmount').value = '';
    return;
  }
  selectedQuote = quotes.best.quote;
  $('toAmount').value = fmtUnits(selectedQuote.amountOut, tOut.decimals);

  let html = '<div class="quote-table">';
  for (const r of quotes.all) {
    const m = SOURCE_META[r.source];
    if (!r.ok) { html += `<div class="qr"><span class="qsrc">${m.label}<span class="tag">${r.reason}</span></span><span></span><span></span></div>`; continue; }
    const q = r.quote;
    const isBest = r === quotes.best, isSel = q === selectedQuote;
    html += `<div class="qr${isBest ? ' winner' : ''}${isSel ? ' selected' : ''}" data-src="${r.source}">
      <span class="qsrc">${m.label}<span class="tag">${m.tag}${q.raw?.kind ? ' · ' + q.raw.kind : ''}</span></span>
      <span class="qout">${fmtUnits(q.amountOut, tOut.decimals)} ${tOut.symbol}${q.amountOutUsd ? `<span class="usd">$${q.amountOutUsd.toFixed(2)}</span>` : ''}</span>
      <span>${isBest ? '<span class="qbadge">BEST</span>' : ''}</span></div>`;
  }
  box.innerHTML = html + '</div>';
  box.querySelectorAll('.qr[data-src]').forEach(el => {
    el.onclick = () => {
      const r = quotes.all.find(x => x.source === el.dataset.src && x.ok);
      if (r) { selectedQuote = r.quote; renderQuotes(tIn, tOut, amtStr); }
    };
  });

  const q = selectedQuote;
  const rate = parseFloat(ethers.formatUnits(q.amountOut, tOut.decimals)) / parseFloat(amtStr);
  detail.innerHTML = `<div class="detail-grid">
    <span class="k">Source</span><span class="v">${SOURCE_META[q.source].label}</span>
    <span class="k">Rate</span><span class="v">1 ${tIn.symbol} ≈ ${rate.toLocaleString(undefined, { maximumFractionDigits: 6 })} ${tOut.symbol}</span>
    <span class="k">Min received</span><span class="v">${fmtUnits(q.amountOut * BigInt(10000 - slippageBps) / 10000n, tOut.decimals)} ${tOut.symbol}</span>
    ${q.gasUsd ? `<span class="k">Est. gas</span><span class="v">$${q.gasUsd.toFixed(4)}</span>` : ''}
  </div>`;

  if (!wallet) { swapBtn.disabled = true; swapBtn.textContent = 'Connect wallet to swap'; }
  else checkApproval();
}

const ERC20_ABI = ['function allowance(address,address) view returns (uint256)', 'function approve(address,uint256) returns (bool)'];

async function checkApproval() {
  const approveBtn = $('approveBtn'), swapBtn = $('swapBtn');
  approveBtn.style.display = 'none';
  if (!selectedQuote || !wallet) return;
  const q = selectedQuote;
  if (q.tokenIn.isNative) { swapBtn.disabled = false; swapBtn.textContent = `Swap via ${SOURCE_META[q.source].label}`; return; }
  try {
    // Build (or estimate) spender: do a lightweight build to learn the spender
    const tx = await ADAPTERS[q.source].buildTx(q, wallet, slippageBps);
    q._tx = tx; // cache
    const c = new ethers.Contract(q.tokenIn.address, ERC20_ABI, signer.provider);
    const al = await c.allowance(wallet, tx.spender);
    if (al < q.amountInWei) {
      approveBtn.style.display = 'block';
      approveBtn.textContent = `Approve ${q.tokenIn.symbol} for ${SOURCE_META[q.source].label}`;
      swapBtn.disabled = true; swapBtn.textContent = 'Approve first';
    } else { swapBtn.disabled = false; swapBtn.textContent = `Swap via ${SOURCE_META[q.source].label}`; }
  } catch (e) {
    // buildTx failed pre-approval (e.g. Velora needs fresh quote) — allow swap attempt anyway
    swapBtn.disabled = false; swapBtn.textContent = `Swap via ${SOURCE_META[q.source].label}`;
  }
}

/* ---------- wallet ---------- */
$('connectBtn').onclick = async () => {
  if (!window.ethereum) { alert('No wallet found'); return; }
  try {
    const wp = new ethers.BrowserProvider(window.ethereum);
    const accts = await wp.send('eth_requestAccounts', []);
    wallet = accts[0]; signer = await wp.getSigner();
    $('connectBtn').textContent = wallet.slice(0, 6) + '…' + wallet.slice(-4);
    await ensureNetwork();
    updateBalances(); scheduleQuote();
  } catch (e) { $('txStatus').textContent = 'Connect failed: ' + e.message.slice(0, 80); }
};

/* ---------- events ---------- */
$('flipBtn').onclick = () => { const f = $('fromToken'), t = $('toToken'); const x = f.value; f.value = t.value; t.value = x; scheduleQuote(); };
$('maxBtn').onclick = async () => {
  if (!wallet) return;
  const { in: tIn } = selTokens();
  try {
    if (tIn.isNative) {
      const bal = await signer.provider.getBalance(wallet);
      $('fromAmount').value = ethers.formatUnits(bal * 90n / 100n, 18);
    } else {
      const c = new ethers.Contract(tIn.address, ERC20_ABI, signer.provider);
      $('fromAmount').value = ethers.formatUnits(await c.balanceOf(wallet), tIn.decimals);
    }
    scheduleQuote();
  } catch (e) {}
};
$('fromAmount').addEventListener('input', scheduleQuote);
$('fromToken').addEventListener('change', scheduleQuote);
$('toToken').addEventListener('change', scheduleQuote);
document.querySelectorAll('[data-slip]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-slip]').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); $('slipCustom').value = '';
  slippageBps = Math.round(parseFloat(b.dataset.slip) * 100); scheduleQuote();
});
$('slipCustom').addEventListener('input', e => {
  const v = parseFloat(e.target.value);
  if (v > 0 && v <= 10) { document.querySelectorAll('[data-slip]').forEach(x => x.classList.remove('active')); slippageBps = Math.round(v * 100); scheduleQuote(); }
});

$('approveBtn').onclick = async () => {
  if (!selectedQuote || !signer) return;
  const q = selectedQuote, st = $('txStatus');
  try {
    st.innerHTML = '<span class="spinner"></span>Approving…'; st.className = 'status';
    const tx = q._tx || await ADAPTERS[q.source].buildTx(q, wallet, slippageBps);
    const c = new ethers.Contract(q.tokenIn.address, ERC20_ABI, signer);
    const atx = await c.approve(tx.spender, q.amountInWei);
    st.innerHTML = '<span class="spinner"></span>Confirming approval…';
    await atx.wait();
    st.textContent = 'Approved ✓'; st.className = 'status success';
    q._tx = null; checkApproval();
  } catch (e) { st.textContent = 'Approval failed: ' + (e.reason || e.message || '').slice(0, 100); st.className = 'status error'; }
};

$('swapBtn').onclick = async () => {
  if (!selectedQuote || !signer) return;
  const q = selectedQuote, st = $('txStatus');
  try {
    await ensureNetwork();
    st.innerHTML = '<span class="spinner"></span>Building transaction…'; st.className = 'status';
    const tx = q._tx || await ADAPTERS[q.source].buildTx(q, wallet, slippageBps);
    // Simulate first — never send a tx we haven't dry-run
    st.innerHTML = '<span class="spinner"></span>Simulating…';
    try {
      await signer.provider.call({ to: tx.to, data: tx.data, value: tx.value, from: wallet });
    } catch (simErr) {
      throw new Error('Simulation reverted — quote is stale or liquidity moved. Re-quote and try again.');
    }
    st.innerHTML = '<span class="spinner"></span>Awaiting signature…';
    const sent = await signer.sendTransaction({ to: tx.to, data: tx.data, value: tx.value });
    st.innerHTML = `<span class="spinner"></span>Confirming… <a href="${CHAINS[chainKey].explorer}/tx/${sent.hash}" target="_blank">view</a>`;
    const rc = await sent.wait();
    st.innerHTML = `Swapped ✓ <a href="${CHAINS[chainKey].explorer}/tx/${rc.hash}" target="_blank">view tx</a>`;
    st.className = 'status success';
    q._tx = null; updateBalances(); scheduleQuote();
  } catch (e) {
    st.textContent = 'Swap failed: ' + (e.reason || e.message || '').slice(0, 140);
    st.className = 'status error';
  }
};

/* ---------- init ---------- */
renderChains(); renderSources(); renderTokens();
scheduleQuote();
</script>
</body>
</html>
